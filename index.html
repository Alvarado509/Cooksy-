<script type="module">
window.addEventListener('error', (e) => {
  const el = document.getElementById('load-error');
  const msg = document.getElementById('load-error-msg');
  if (el && msg && el.style.display === 'none') {
    el.style.display = 'block';
    msg.textContent = (e.error && e.error.stack) ? e.error.stack : e.message;
  }
});
window.addEventListener('unhandledrejection', (e) => {
  const el = document.getElementById('load-error');
  const msg = document.getElementById('load-error-msg');
  if (el && msg && el.style.display === 'none') {
    el.style.display = 'block';
    msg.textContent = (e.reason && e.reason.stack) ? e.reason.stack : String(e.reason);
  }
});
</script>

const hashString = (str) => {
    let hash = 0;
    for (let i = 0; i < (str || '').length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);

    }
    return Math.abs(hash);
};

function getPersonalizedRecommendations(allRecipes, tasteDNA, rotationOffset = 0, recentRecipeIds = [], userInteractions = {}) {
    if (!allRecipes || allRecipes.length === 0)
        return [];

    const hiddenIds = userInteractions.hiddenRecipeIds || [];
    const dislikedEntries = userInteractions.dislikedRecipes || [];
    const boards = userInteractions.boards || [];
    const cookLaterIds = userInteractions.cookLaterRecipeIds || [];

    const bookmarkedRecipes = allRecipes.filter(r => r.isFavorite || r.isBookmarked);
    const bookmarkedCategories = new Set(bookmarkedRecipes.map(r => r.category.toLowerCase()));

    const recipesInBoards = allRecipes.filter(r => (r.boardIds || []).length > 0);
    const boardCategories = new Set(recipesInBoards.map(r => r.category.toLowerCase()));

    const scored = allRecipes.map((recipe) => {
        if (hiddenIds.includes(recipe.id) || dislikedEntries.some(d => d.id === recipe.id)) {
            return { recipe, score: -9999, recommendationReason: '' };
        }

        let score = 50;

        const isBookmarked = recipe.isFavorite || recipe.isBookmarked;
        if (isBookmarked) score += 30;
        if (bookmarkedCategories.has(recipe.category.toLowerCase())) score += 20;

        const inBoard = (recipe.boardIds || []).length > 0;
        if (inBoard) score += 25;
        if (boardCategories.has(recipe.category.toLowerCase())) score += 15;

        if (cookLaterIds.includes(recipe.id)) score += 35;

        const isFavCuisine = (tasteDNA.favoriteCuisines || []).some((c) => 
            c.toLowerCase() === recipe.category.toLowerCase() ||
            (recipe.tags || []).some((t) => t.toLowerCase() === c.toLowerCase())
        );
        if (isFavCuisine) score += 30;

        const matchingIngredients = (recipe.ingredients || []).filter((ing) => 
            (tasteDNA.favoriteIngredients || []).some((fav) => ing.name.toLowerCase().includes(fav.toLowerCase()))
        );
        score += matchingIngredients.length * 15;

        const hasDisliked = (recipe.ingredients || []).some((ing) => 
            (tasteDNA.dislikedIngredients || []).some((dis) => ing.name.toLowerCase().includes(dis.toLowerCase()))
        );
        if (hasDisliked) score -= 150;

        const matchesDietary = (recipe.tags || []).some((tag) => 
            (tasteDNA.healthGoals || []).concat(tasteDNA.dietaryPreferences || []).some((pref) => tag.toLowerCase().includes(pref.toLowerCase()))
        );
        if (matchesDietary) score += 20;

        const totalTime = recipe.prepTimeMinutes + recipe.cookTimeMinutes;
        if (totalTime <= 25) score += 15;

        if (recentRecipeIds.includes(recipe.id)) {
            score -= 30;
        }

        let recommendationReason = 'Perfect match for your taste';
        if (isBookmarked) {
            recommendationReason = 'Saved in your bookmarks';
        } else if (inBoard) {
            const firstBoardId = recipe.boardIds[0];
            const matchingBoard = boards.find(b => b.id === firstBoardId);
            recommendationReason = matchingBoard ? `Saved in your "${matchingBoard.name}" board` : 'Saved in your boards';
        } else if (cookLaterIds.includes(recipe.id)) {
            recommendationReason = 'Saved for your upcoming meals';
        } else if (isFavCuisine) {
            recommendationReason = `Inspired by your love for ${recipe.category}`;
        } else if (matchingIngredients.length > 0) {
            recommendationReason = `Includes fresh ${matchingIngredients[0].name.split(' ')[0]}`;
        } else if (matchesDietary) {
            recommendationReason = `Fits your ${tasteDNA.healthGoals?.[0] || 'healthy'} goal`;
        } else if (totalTime <= 20) {
            recommendationReason = `Quick ${totalTime}-min weeknight meal`;
        }

        return {
            recipe,
            score,
            recommendationReason
        };
    });

    const valid = scored.filter((item) => item.score > 0);
    const sorted = [...valid].sort((a, b) => b.score - a.score);
    if (sorted.length === 0)
        return [];

    const shift = (rotationOffset % sorted.length + sorted.length) % sorted.length;
    const rotated = [...sorted.slice(shift), ...sorted.slice(0, shift)];
    return rotated.map((item) => ({
        recipe: item.recipe,
        recommendationReason: item.recommendationReason
    }));
}

        setAppState('app');
    };

        if (e) e.stopPropagation();
        setRecipes((prev) => prev.map((r) => {
            if (r.id !== id) return r;
            const currentSaved = r.isBookmarked !== false;
            const nextSaved = !currentSaved;
            showUndo(nextSaved ? `Saved "${r.title}" to Cookbook` : `Removed "${r.title}" from Cookbook`);
            return { ...r, isBookmarked: nextSaved };
        }));
        if (selectedRecipe && selectedRecipe.id === id) {
            setSelectedRecipe((prev) => prev ? { ...prev, isBookmarked: prev.isBookmarked === false ? true : false } : null);
        }
    };
    const handleToggleFavorite = (id, e) => {
        if (e) e.stopPropagation();
        setRecipes((prev) => prev.map((r) => {
            if (r.id !== id) return r;
            const nextFav = !r.isFavorite;
            showUndo(nextFav ? `Added "${r.title}" to Favorites ⭐` : `Removed "${r.title}" from Favorites`);
            return { ...r, isFavorite: nextFav };
        }));
        if (selectedRecipe && selectedRecipe.id === id) {
            setSelectedRecipe((prev) => prev ? { ...prev, isFavorite: !prev.isFavorite } : null);
        }
    };
    const handleCookLater = (recipe) => {
        setCookLaterRecipeIds((prev) => {
            const has = prev.includes(recipe.id);
            const next = has ? prev.filter(id => id !== recipe.id) : [...prev, recipe.id];
            showUndo(has ? `Removed "${recipe.title}" from Cook Later` : `Added "${recipe.title}" to Cook Later queue`);
            return next;
        });
    };
    const handleShareRecipe = (recipe) => {
        if (navigator.clipboard) {
            navigator.clipboard.writeText(window.location.href);
            showUndo(`Recipe link for "${recipe.title}" copied to clipboard!`);
        } else {
            showUndo(`Recipe link for "${recipe.title}" copied!`);
        }
    };
    const handleIDontLikeThisSubmit = (recipe, reason, detail) => {
        setDislikedRecipeIds((prev) => [...new Set([...prev, recipe.id])]);
        setDislikedReasons((prev) => [...prev, { recipeId: recipe.id, reason, detail, timestamp: new Date().toISOString() }]);
        showUndo(`Preference saved. We'll show fewer recipes like "${recipe.title}".`);
    };
    const handleDontRecommendSimilar = (recipe) => {
        setDislikedRecipeIds((prev) => [...new Set([...prev, recipe.id])]);
        if (recipe.category) {
            setSuppressedCategories((prev) => [...new Set([...prev, recipe.category])]);
        }
        if (recipe.tags) {
            setSuppressedTags((prev) => [...new Set([...prev, ...recipe.tags])]);
        }
        showUndo(`Preferences updated. Similar recipes will be shown less.`);
    };
    const handleRenameRecipeSubmit = (recipeId, newTitle) => {
        if (!newTitle || !newTitle.trim()) return;
        setRecipes((prev) => prev.map((r) => r.id === recipeId ? { ...r, title: newTitle.trim() } : r));
        if (selectedRecipe && selectedRecipe.id === recipeId) {
            setSelectedRecipe((prev) => prev ? { ...prev, title: newTitle.trim() } : null);
        }
        showUndo(`Recipe renamed to "${newTitle.trim()}"`);
    };
    const handleAddGroceryItems = (newItems) => {
        const formatted = newItems.map((item, idx) => ({
            id: `gro-${Date.now()}-${idx}`,
            name: item.name,
            quantity: item.quantity,
            category: item.category,
            isChecked: false,
            addedAt: new Date().toISOString()

        setGroceryItems((prev) => [...formatted, ...prev]);

        setBoards((prev) => prev.map((b) => (b.id === boardId ? { ...b, updatedAt: new Date().toISOString() } : b)));
    };

    };

    const handleDeleteBoard = (board) => {
